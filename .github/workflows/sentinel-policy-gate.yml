name: SENTINEL Policy Gate

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  opa-policy-tests:
    name: OPA Policy Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -L -o opa \
            https://openpolicyagent.org/downloads/v1.21.1/opa_linux_amd64_static

          chmod +x opa
          sudo mv opa /usr/local/bin/opa

          opa version

      - name: Check Rego formatting
        run: |
          opa fmt --fail --list policies tests/policies

      - name: Run OPA unit tests
        run: |
          opa test policies tests/policies -v

  terraform-gcp-validation:
    name: Terraform GCP Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/gcp/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Format Check
        working-directory: .
        run: |
          terraform fmt -check -recursive \
            modules/gcp \
            environments/gcp

      - name: Terraform Init
        run: |
          terraform init -backend=false

      - name: Terraform Validate
        run: |
          terraform validate

  terraform-gcp-plan:
    name: Federated Terraform GCP Plan
    runs-on: ubuntu-latest
    needs:
      - terraform-gcp-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: environments/gcp/dev

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_gcp_project_id: mid-sentinel-sbx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to GCP with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: mid-sentinel-sbx
          workload_identity_provider: projects/988087918854/locations/global/workloadIdentityPools/sentinel-github/providers/github
          service_account: sentinel-github-deploy@mid-sentinel-sbx.iam.gserviceaccount.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init with shared state
        run: |
          terraform init

      - name: Terraform Plan against GCP
        run: |
          terraform plan -lock=false -no-color

  checkpoint-8-gate:
    name: SENTINEL CI Gate
    runs-on: ubuntu-latest
    needs:
      - opa-policy-tests
      - terraform-gcp-validation
      - terraform-gcp-plan
    if: >-
      always() &&
      needs.opa-policy-tests.result == 'success' &&
      needs.terraform-gcp-validation.result == 'success' &&
      (
        needs.terraform-gcp-plan.result == 'success' ||
        (github.event_name == 'pull_request' && needs.terraform-gcp-plan.result == 'skipped')
      )

    steps:
      - name: Policy gate passed
        run: |
          echo "SENTINEL CI policy gate PASSED."
          echo "OPA policies and Terraform configuration validated successfully."
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Terraform authenticated to GCP through OIDC/WIF and completed a live plan."
          else
            echo "The live GCP plan is restricted to trusted pushes on main."
          fi
