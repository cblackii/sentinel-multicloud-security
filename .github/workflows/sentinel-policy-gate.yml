name: SENTINEL Policy Gate

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  opa-policy-tests:
    name: OPA Policy Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -L -o opa \
            https://openpolicyagent.org/downloads/v1.21.1/opa_linux_amd64_static

          chmod +x opa
          sudo mv opa /usr/local/bin/opa

          opa version

      - name: Check Rego formatting
        run: |
          opa fmt --fail --list policies tests/policies

      - name: Run OPA unit tests
        run: |
          opa test policies tests/policies -v

  terraform-gcp-validation:
    name: Terraform GCP Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/gcp/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Format Check
        working-directory: .
        run: |
          terraform fmt -check -recursive \
            modules/gcp \
            environments/gcp

      - name: Terraform Init
        run: |
          terraform init -backend=false

      - name: Terraform Validate
        run: |
          terraform validate

  checkpoint-8-gate:
    name: SENTINEL CI Gate
    runs-on: ubuntu-latest
    needs:
      - opa-policy-tests
      - terraform-gcp-validation

    steps:
      - name: Policy gate passed
        run: |
          echo "SENTINEL CI policy gate PASSED."
          echo "OPA policies and Terraform configuration validated successfully."
